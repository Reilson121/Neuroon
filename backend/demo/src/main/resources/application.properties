spring.application.name=demo
server.address=${NEURON_BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/neuron}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# A base do protótipo já contém chunk_documento. Baseline é uma ação explícita
# de preparação; não autorizar automaticamente qualquer base não vazia.
spring.flyway.baseline-on-migrate=${NEURON_BASELINE_EXISTING_DATABASE:false}
spring.flyway.baseline-version=0
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${NEURON_SECURE_COOKIE:false}
ai-service.base-url=${AI_SERVICE_URL:http://127.0.0.1:8000}
ai-service.token=${NEURON_INTERNAL_TOKEN:}
neuron.practice.session-ttl-minutes=60
neuron.practice.max-sessions=1000
neuron.materials.root=${NEURON_MATERIALS_ROOT:../../neuron-ai/materiais_academicos}
